<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishGuard</title>
    <link rel="stylesheet" href="taskpane.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>

    <div class="container">

        <aside class="hex-rail" aria-hidden="true">
            <span>0x0000</span>
            <span>0x0010</span>
            <span>0x0020</span>
            <span>0x0030</span>
            <span>0x0040</span>
        </aside>

        <h1>PhishGuard</h1>

        <p class="subtitle">
            Analizador de correos sospechosos
        </p>

        <button id="analyzeButton">
            🔍 Analizar correo
        </button>

        <div id="result">
            <p>Esperando análisis...</p>
        </div>
        <button id="reportButton" style="display: none;">
    🚨 Reportar phishing
</button>

    </div>

    <script src="taskpane.js"></script>

</body>
</html>
